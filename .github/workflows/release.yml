name: Prepare foundation source artifact

# Manual artifact preparation only. This workflow never publishes a release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure release core tests
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build and test
        run: |
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure --no-tests=error
      - name: Package committed source with provenance
        run: |
          mkdir -p build/artifacts
          git archive --format=tar.gz --prefix=darkvoice-foundation/ HEAD -o build/artifacts/darkvoice-foundation-source.tar.gz
          git rev-parse HEAD > build/artifacts/COMMIT.txt
          cp CHANGELOG.md build/artifacts/CHANGELOG.md
          cd build/artifacts
          sha256sum darkvoice-foundation-source.tar.gz > SHA256SUMS.txt
      - name: Retain foundation source artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: darkvoice-foundation-source-${{ github.sha }}
          path: build/artifacts/
          if-no-files-found: error
          retention-days: 14

# No application/plugin binary exists yet. Publication needs explicit approval
# and a separate protected workflow once release acceptance criteria are defined.
