name: Prepare unsigned development artifacts

# Manual artifact preparation only. This workflow never publishes a release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  development-artifacts:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Linux development dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libasound2-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev
      - name: Prepare immutable JUCE source
        shell: bash
        run: |
          mkdir -p build/juce-source
          git -C build/juce-source init
          git -C build/juce-source remote add origin https://github.com/juce-framework/JUCE.git
          git -C build/juce-source fetch --depth 1 origin 51a8a6d7aeae7326956d747737ccf1575e61e209
          git -C build/juce-source -c core.hooksPath=/dev/null checkout --detach 51a8a6d7aeae7326956d747737ccf1575e61e209
      - name: Verify packaging regression tests
        run: python3 -B -m unittest discover -s tests -p package_development_tests.py
      - name: Configure unsigned development products
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DDARKVOICE_BUILD_PRODUCTS=ON -DDARKVOICE_JUCE_SOURCE_DIR="$GITHUB_WORKSPACE/build/juce-source"
      - name: Build and test
        run: |
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure --no-tests=error
          git rev-parse HEAD > build/DARKVOICE_BUILD_COMMIT.txt
      - name: Package runtime products and complete corresponding source
        shell: bash
        env:
          ARTIFACT_PLATFORM: ${{ runner.os == 'macOS' && 'macos' || 'linux' }}
        run: |
          python3 tools/package-development.py --source "$GITHUB_WORKSPACE" \
            --build "$GITHUB_WORKSPACE/build" --juce-source "$GITHUB_WORKSPACE/build/juce-source" \
            --platform "$ARTIFACT_PLATFORM" --output "$GITHUB_WORKSPACE/build/artifacts" \
            --expected-commit "$GITHUB_SHA"
      - name: Retain unsigned development artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: darkvoice-unsigned-${{ matrix.os }}-${{ github.sha }}
          path: build/artifacts/
          if-no-files-found: error
          retention-days: 14

# Public publication, signing and notarization require separate authorization,
# credentials and release acceptance. No release-upload API is invoked here.
