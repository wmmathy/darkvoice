name: Core build and tests

on:
  pull_request:
  push:
    branches: [main, 'feature/**', 'fix/**', 'refactor/**', 'docs/**']

permissions:
  contents: read

jobs:
  core:
    name: Core / ${{ matrix.os }} / ${{ matrix.configuration }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure C++20 core
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DBUILD_TESTING=ON
      - name: Build with warnings as errors
        run: cmake --build build --config ${{ matrix.configuration }} --parallel 2
      - name: Run core regression suites
        run: ctest --test-dir build --build-config ${{ matrix.configuration }} --output-on-failure --no-tests=error

  sanitizers:
    name: Core / Linux / ASan and UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure sanitizer build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DDARKVOICE_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Run memory and undefined behavior checks
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure --no-tests=error

# AU/VST3/standalone and DAW validation remain pending their actual targets.
